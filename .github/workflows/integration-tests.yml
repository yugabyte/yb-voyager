name: Go

on:
  push:
    branches: ['main', '*.*-dev', '*.*.*-dev']
  pull_request:
    branches: [main]

env:
  ORACLE_INSTANT_CLIENT_VERSION: "21.5.0.0.0-1"

jobs:
  prepare-versions:
    uses: ./.github/workflows/prepare-versions.yml

  integration-tests:
    needs: [prepare-versions]
    strategy:
      fail-fast: false
      matrix: 
        test-tags: [integration_voyager_command, integration, integration_live_migration]

    runs-on: ubuntu-22.04

    env:
      YB_VOYAGER_SEND_DIAGNOSTICS: 0

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      # https://github.com/actions/setup-java
      with:
        distribution: "temurin"
        java-version: ${{ needs.prepare-versions.outputs.java_version }}
        check-latest: true

    - name: Compute Maven cache key
      id: maven-cache-key
      # Computed once, before the build, so the restore and save steps agree on it.
      # The Debezium build writes into debezium-server-voyager/target/, and
      # hashFiles() is evaluated over the workspace, so re-evaluating it after the
      # installer has run risks saving under a key no restore ever looks for.
      run: echo "key=${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore local Maven repository
      id: maven-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: ${{ steps.maven-cache-key.outputs.key }}
        # Prefix fallback, so a PR that does change the cached inputs still
        # restores most of the dependency tree and only fetches the delta.
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ needs.prepare-versions.outputs.go_version }}

    - name: Run installer script to setup voyager and dependencies for running integration tests
      run: |
        cd installer_scripts
        yes | ./install-yb-voyager --install-from-local-source
        sudo rm /usr/bin/pg_dump
        sudo ln -s /usr/lib/postgresql/17/bin/pg_dump /usr/bin/pg_dump
        sudo rm /usr/bin/pg_restore
        sudo ln -s /usr/lib/postgresql/17/bin/pg_restore /usr/bin/pg_restore
        pg_dump --version
        pg_restore --version
        psql --version
      env:
        ON_INSTALLER_ERROR_OUTPUT_LOG: Y

    # Save only from the default branch (or a PR labelled `cache-maven`).
    # This gate is load-bearing: ~/.m2 is ~1.3 GiB against a 10 GiB repo budget,
    # so when every PR saved its own copy, 8 duplicates of the same key filled the
    # budget (measured 10.43 GiB), LRU eviction took out main's entry, ~95% of jobs
    # then missed, and each miss wrote another copy that evicted the next one.
    # A run falls back to the default branch's cache, so one entry on main serves
    # every PR. Label a PR `cache-maven` if it legitimately changes the cached
    # inputs (e.g. a Debezium ref bump) and needs to populate its own entry.
    #
    # success() is explicit because a custom `if:` drops the implicit success()
    # check, and a ~/.m2 left behind by a failed build must never be cached.
    - name: Save local Maven repository
      if: >-
        success() &&
        steps.maven-cache.outputs.cache-hit != 'true' &&
        (github.ref == 'refs/heads/main' ||
        contains(github.event.pull_request.labels.*.name, 'cache-maven'))
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository
        key: ${{ steps.maven-cache-key.outputs.key }}

    - name: Free disk 
      run: df -h /

    - name: cleanup 
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk after cleanup
      run: df -h /

    - name: Set up gotestfmt
      uses: GoTestTools/gotestfmt-action@v2

    # Note: Some voyager_command related go tests use a voyager binary to call voyager commands
    # Hence its important to ensure the voyager binary built is using the changes in the PR branch - `./install-yb-voyager --install-from-local-source`
    - name: Run Integration Tests (${{ matrix.test-tags }})
      env: 
        YB_VERSION: ${{ needs.prepare-versions.outputs.yb_latest_stable }}
        PG_VERSION: "17"
        ORACLE_VERSION: "21"
        MYSQL_VERSION: "8.4"
      run: |
        set -euo pipefail
        cd yb-voyager
        go test -json -v ./... -tags ${{ matrix.test-tags }} -timeout 35m -parallel 4 2>/tmp/gotest-stderr.log | tee /tmp/gotest.log | gotestfmt
        if [ -s /tmp/gotest-stderr.log ]; then
          echo "::group::stderr output (docker/testcontainer logs)"
          cat /tmp/gotest-stderr.log
          echo "::endgroup::"
        fi

    - name: Upload test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-log-${{ matrix.test-tags }}
        path: |
          /tmp/gotest.log
          /tmp/gotest-stderr.log
        retention-days: 7
