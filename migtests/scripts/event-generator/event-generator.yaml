connection:
  # Hostname or IP of the PostgreSQL server
  host: localhost
  # Port PostgreSQL is listening on
  port: 5432
  # Target database name
  database: sakila
  # Username for authentication
  user: postgres
  # Password for authentication
  password: postgres

generator:
  # Schema from which tables are discovered when manual_table_list is empty
  schema_name: public

  # Explicit list of tables to generate events for
  # If empty, the generator scans the schema for all base tables
  manual_table_list: [eg_users, eg_orders]

  # Tables to exclude when scanning the schema (ignored if manual_table_list is non-empty)
  exclude_table_list: []

  # Total number of operations to attempt (INSERT/UPDATE/DELETE)
  # If -1, the generator will run indefinitely
  num_iterations: 2000

  # After this many operations, sleep for wait_duration_seconds (0 disables sleeping)
  wait_after_operations: 200000
  # Duration in seconds to sleep at each throttle interval
  wait_duration_seconds: 0

  # Optional per-table selection weights; unspecified tables default to weight=1
  # Example: { customers: 5, orders: 2 }
  table_weights: { eg_users: 100, eg_orders: 100 }

  # Operation weights map; omit or set 0 to disable an operation
  operation_weights: { INSERT: 3, UPDATE: 2, DELETE: 1 }

  # Determinism seeds (YAML-only)
  # random_seed: seeds Python's random module for table/op choices and numeric data
  random_seed: 12345
  # faker_seed: seeds Faker for text, timestamps, UUIDs, etc. Defaults to random_seed if omitted
  faker_seed: 12345

  # Rows affected per operation (batch sizes)
  insert_rows: 4
  update_rows: 2
  delete_rows: 1

  # Retry limits for operations that can be retried (e.g., on unique violations)
  insert_max_retries: 50
  update_max_retries: 3

  # Enable concurrent index create/drop operations alongside IUD operations
  enable_index_create_drop: false

  # Index events interval in seconds
  index_events_interval: 5

  # Column min size in bytes (for text, json, jsonb, tsvector columns). Set to 0 to disable.
  min_col_size_bytes: 0

  # ---------------------------------------------------------------------------
  # Rate control (optional). Paces the aggregate events/sec the generator
  # produces, where an event = one changed row (cursor.rowcount after each
  # operation: an INSERT batch counts its rows, UPDATE/DELETE count whatever
  # the sampling actually hit, a failed/rolled-back op counts 0).
  #
  # Nullability rules:
  #   - rate_control omitted (default)      -> no pacing; the generator runs as
  #     fast as the DB allows (today's behavior). wait_after_operations /
  #     wait_duration_seconds above still apply.
  #   - rate_control present, no schedule   -> steady rate at
  #     default_events_per_second.
  #   - rate_control present, with schedule -> baseline plus recurring spike
  #     windows. When windows overlap, the max events_per_second wins.
  #
  # When this block is present, wait_after_operations / wait_duration_seconds
  # above are IGNORED (a one-line warning is printed at startup), since they
  # would fight the governor.
  #
  # Validation (fails fast at startup with a clear message):
  #   - default_events_per_second must be > 0.
  #   - Each schedule entry: events_per_second > 0, duration_seconds > 0,
  #     every_seconds > 0, offset_seconds >= 0, 0 <= jitter_pct <= 50.
  #   - offset_seconds + duration_seconds <= every_seconds, so a spike window
  #     fits inside its period and does not bleed into the next.
  #   - Unknown keys inside rate_control / schedule entries print a
  #     non-fatal warning (typo guard).
  #
  # Anatomy of one period (every_seconds):
  #
  #   |<--------------------- every_seconds (30 min) --------------------->|
  #   |<--- offset --->|<-- duration -->|<--------- recovery tail -------->|
  #   |    (10 min)    |    (5 min)     |            (15 min)              |
  #   +================+################+==================================+
  #        baseline          SPIKE                   baseline
  #   ^period start                                      ^next period start
  #
  # Repeating over the run   (░ = baseline, █ = spike):
  #
  #   t(min): 0        10   15            30   40   45            60
  #           ░░░░░░░░░░█████░░░░░░░░░░░░░░░░░░░░█████░░░░░░░░░░░░░░░  ...
  #           └─ period 1 (30m) ──────────────┘└─ period 2 (30m) ──┘
  #
  #   Gap between consecutive spikes = every_seconds − duration_seconds
  #                                  = 1800 − 300 = 1500 s (25 min),
  #   independent of offset (offset only sets the phase / first-spike delay).
  #
  # Sample below is the 24h fall-back (YB->PG) throughput-test config: a
  # ~1.5k ev/s baseline with a 10k ev/s spike for 5 min every 30 min.
  #
  # rate_control:
  #   # Baseline rate (events/sec) when no schedule entry is active.
  #   # Required when this block is present. Must be > 0.
  #   default_events_per_second: 1500
  #   # Log achieved ev/s, current target, and cumulative event count every N
  #   # seconds. Omit or set to 0 to disable reporting.
  #   report_interval_seconds: 60
  #   # Optional list of recurring spike windows layered on the baseline.
  #   schedule:
  #     - events_per_second: 10000  # spike target rate. Must be > 0.
  #       duration_seconds: 300     # spike window length (s). Must be > 0.
  #       every_seconds: 1800       # period between spikes (s). Must be > 0.
  #       offset_seconds: 600       # delay before first spike each period (s);
  #                                 # default 0. Sets the phase.
  #       jitter_pct: 10            # +/-N% deterministic randomization (seeded
  #                                 # by random_seed) of spike start time and
  #                                 # rate; default 0, must be 0..50.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Transaction mode (optional). Default OFF ('enabled: false' or the whole
  # block absent) -- the generator then runs today's single-op-per-iteration
  # loop exactly as before. When enabled, each iteration executes ONE
  # multi-statement transaction (BEGIN ... [SAVEPOINT ... RELEASE SAVEPOINT
  # ...] ... COMMIT) instead of one op, split into statements (single-row by
  # default, or batched via rows_per_statement below for UPDATE/DELETE)
  # against a small "hot" set of tables plus the normal weighted pool of
  # everything else. Each committed ROW counts as one event (rate governor
  # target is rows/sec, same as the legacy single-op path).
  #
  # transaction_mode:
  #   enabled: false
  #   # Tables hammered every transaction, regardless of table_weights.
  #   # Generic placeholders below -- replace with real table names from
  #   # your own schema; never leave example names active in a real run.
  #   hot_tables: [table_a, table_b]
  #   # Total statements per transaction: T, sampled from [min, max].
  #   statements_per_txn: { min: 4, max: 12 }
  #   # Of T, how many target a hot_tables entry (H) vs. everything else (O).
  #   # H and O are each sampled from their own [min, max], then reconciled
  #   # so H + O == T (O is adjusted first, then H, staying within their own
  #   # ranges and within statements_per_txn's range) -- so these three
  #   # ranges should be "compatible" (statements_per_txn.min <=
  #   # hot_statements_per_txn.min + other_statements_per_txn.min, and
  #   # statements_per_txn.max >= the two maxes summed).
  #   hot_statements_per_txn: { min: 2, max: 6 }
  #   other_statements_per_txn: { min: 2, max: 6 }
  #   # Number of SAVEPOINT/RELEASE SAVEPOINT pairs wrapped around random
  #   # contiguous sub-runs of the transaction's statements (clamped to the
  #   # actual statement count -- a pair needs at least one statement).
  #   savepoint_pairs_per_txn: { min: 0, max: 3 }
  #   # Per-statement operation weights, same shape as operation_weights
  #   # above, but separate for hot vs. other statements.
  #   hot_op_weights: { INSERT: 3, UPDATE: 2, DELETE: 1 }
  #   other_op_weights: { INSERT: 3, UPDATE: 2, DELETE: 1 }
  #   # OPTIONAL. Rows a single statement affects/inserts, sampled per
  #   # statement from [min, max]. Batches rows onto one round trip instead
  #   # of one row per round trip, amortizing statement/network latency;
  #   # each changed/inserted ROW still counts as one event (not each
  #   # statement) for the rate governor. Absent key means every op is
  #   # single-row -- today's behavior, unchanged. Two accepted shapes:
  #   #
  #   # 1. Shared form (back-compat): a single { min, max } range applied to
  #   #    UPDATE and DELETE only -- INSERT stays single-row regardless, for
  #   #    byte-for-byte compatibility with configs written before per-op
  #   #    batching existed.
  #   #      rows_per_statement: { min: 1, max: 5 }
  #   #
  #   # 2. Per-op form: independent { min, max } ranges for INSERT, UPDATE,
  #   #    and DELETE. Any of the three keys may be omitted -- an omitted
  #   #    op defaults to single-row. INSERT batching (multi-row INSERT ...
  #   #    VALUES (...), (...), ...) is ONLY available in this form.
  #   #      rows_per_statement: { INSERT: {min: 25, max: 25}, UPDATE: {min: 12, max: 12}, DELETE: {min: 6, max: 6} }
  #   #
  #   # The two forms cannot be mixed in one block (e.g. 'min' alongside
  #   # 'UPDATE') -- pick one.
  # ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Parallel / dynamic-worker controller (optional, top-level block).
#
# `generator.py` is a single process. To reach rates one process can't push,
# run `parallel_generator.py` instead: it launches N copies of generator.py
# and adjusts N at runtime with a reactive controller so the AGGREGATE
# achieved rate tracks the `generator.rate_control` target (whose numbers are
# now interpreted as the TOTAL across all workers, not per-worker).
#
# How it works (short version): it first calibrates the per-worker throughput
# ceiling C (one warmed-up probe worker), then adds/removes whole workers to
# hit the target, with one fractional "trimmer" worker for fine adjustment.
# It re-measures C over the run and spreads workers across cluster nodes.
# Full internals: see ARCHITECTURE.md in this directory.
#
# Omit this block to run single-process (generator.py). Include it and run
# `python3 parallel_generator.py -c <this-file>` to run the pool.
#
# parallel:
#   # --- run control ---
#   run_seconds: 1800            # total run duration after calibration (s).
#                                #   default 604800 (7 days). Ctrl+C/SIGTERM also stop cleanly.
#   max_workers: 8               # hard cap on worker processes. If the peak target needs more,
#                                #   the count is clamped here and the shortfall is logged.
#
#   # --- calibration (measuring the per-worker ceiling C) ---
#   calibration_seconds: 30      # length of the measurement window (s). Bigger = steadier C.
#   calibration_warmup_seconds: 20  # warm the probe worker this long BEFORE measuring, so C
#                                #   reflects steady state not a cold start. 0 = legacy (measure
#                                #   from spawn). Cold C reads ~3-4x low and causes spike overshoot.
#   recalibrate: true            # re-estimate C during the run (clamped EMA) to track drift.
#
#   # --- reactive control loop ---
#   control_interval_seconds: 5  # how often the controller samples achieved rate and acts.
#   allow_throttle: true         # true = cascade controller (coarse whole-worker knob + a fine
#                                #   throttled trimmer worker). false = bang-bang (whole workers only,
#                                #   uses deadband_pct/cooldown_seconds below).
#   reactive_margin: 1.5         # backpressure cap: never grow the pool beyond
#                                #   ceil(target/C) * this. Past it, a low reading is cluster-bound
#                                #   (adding workers just piles load on a struggling cluster).
#   meter_window_seconds: 15.0   # trailing window the raw meter is averaged over before the
#                                #   controller acts. Denoises the 5s pg_stat_statements reading.
#   deadband_pct: 10             # (bang-bang path only) +/-% band around target where it holds.
#   cooldown_seconds: 10         # (bang-bang path only) min seconds between worker add/remove.
#
#   # --- PK pool / unique-value generation ---
#   pk_pool_maxsize: 20000       # per-table in-memory PK pool size for fast UPDATE/DELETE targeting.
#   pk_stride: 100000            # per-worker value stride for collision-free unique generation.
#                                #   Must exceed the max worker count in a run (safe unless ~100k workers).
#   snapshot_refresh_seconds: 10800  # how often the shared PK/schema cache is rebuilt (s).
#
#   # --- multi-node ---
#   distribute_across_nodes: true  # round-robin workers across all tservers (via yb_servers()).
#                                #   Set false only if node host/ports aren't directly reachable.
#
#   # --- advanced cascade-trimmer tuning (rarely changed; see ARCHITECTURE.md) ---
#   # fine_kp: 0.6  fine_deadband_pct: 2.0  fine_slew_pct: 50.0
#   # sat_ticks_needed: 2  high_sat_pct: 98.0  low_sat_pct: 2.0
# ---------------------------------------------------------------------------