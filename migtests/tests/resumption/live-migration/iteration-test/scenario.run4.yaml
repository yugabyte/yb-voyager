# ============================================================================
# RUN 2 — FALL-BACK SPIKE SOAK  --  PRE-SPLIT + AUTO-SPLIT-OFF + SKEWED LOAD
#
# Fresh start-clean run, applying the three lessons from run 1:
#   * Finding 2/4 (split broke, unrecoverable CDC stream) -> auto-split is turned
#     OFF cluster-wide in YBA (enable_automatic_tablet_splitting=false), and the 7
#     hottest tables are PRE-SPLIT to 6 tablets each (see presplit_heavy_tables).
#   * Finding 3 (tserver SIGSEGV) -> yb_enable_expression_pushdown=off stays set.
#   * Load is now a TEMPERED skew mirroring the GoCardless row-count profile
#     (table_weights below) instead of uniform.
#
# Topology unchanged from run 1:
#   - …203 (16 vCPU, 191 GB): voyager export/import daemons + queue + monitor
#   - …77  (32 vCPU):         parallel_generator.py, all cores to itself -> 10k
#
# *** PREREQUISITE (manual, before launch): in YBA set
#       enable_automatic_tablet_splitting = false   (+ rolling restart)
#     Leave ysql_num_tablets = 1 (targeted pre-split is done via DDL, not the gflag)
#     and yb_enable_expression_pushdown = off (Finding-3 mitigation). ***
# ============================================================================

name: spike-run4-6k-real-tablets

num_iterations: 1

env:
  LOG_LEVEL: info
  QUEUE_SEGMENT_MAX_BYTES: 10485760

export_dir: ./spike-export-dir-run4      # fresh dir; run-1's ./spike-export-dir kept for evidence
artifacts_dir: ./spike-artifacts-run4

source:                          # data falls BACK here (import-to-source)
  type: postgresql
  host: voyager-gocardless-spike-test.cbtcvpszcgdq.us-west-2.rds.amazonaws.com
  port: 5432
  database: test_db
  user: ybvoyager
  password: Test@123#$%^&*()!
  schema: public
  admin:
    user: postgres
    password: postgres

target:                          # load driven here; pushdown gflag OFF, auto-split OFF
  type: yugabytedb
  host: 10.9.124.125
  port: 5433
  database: test_db
  user: yugabyte
  password: Yugabyte@123
  admin:
    user: yugabyte
    password: Yugabyte@123

# Forward-phase seed generator (simple generator.py, ~120s, light). Runs LOCALLY
# on the voyager box -- trivial CPU, and the gen box isn't needed until fall-back.
generator_source:
  config_inline:
    connection:
      host: voyager-gocardless-spike-test.cbtcvpszcgdq.us-west-2.rds.amazonaws.com
      port: 5432
      database: test_db
      user: postgres
      password: postgres
    generator:
      schema_name: public
      manual_table_list: []
      exclude_table_list: [cutover_table, migration_validate_segments]
      num_iterations: -1
      wait_after_operations: 200
      wait_duration_seconds: 1
      table_weights: {}
      operation_weights: {INSERT: 3, UPDATE: 2, DELETE: 1}
      random_seed: 123
      faker_seed: 123
      insert_rows: 10
      update_rows: 5
      delete_rows: 2
      insert_max_retries: 5
      update_max_retries: 1

# Fall-back-phase spike generator -- runs on the GEN BOX over SSH.
generator_target:
  remote:
    host: 10.9.100.77
    user: ubuntu
    ssh_key: /home/ubuntu/.yugabyte/yb-dev-aws-2.pem   # on the ORCHESTRATOR box (…203)
    repo_dir: /home/ubuntu/yb-voyager                  # repo root on the GEN box (…77)
  config_inline:
    connection:
      host: 10.9.124.125
      port: 5433
      database: test_db
      user: yugabyte
      password: Yugabyte@123
    generator:
      schema_name: public
      manual_table_list: []
      exclude_table_list: [cutover_table, migration_validate_segments]
      num_iterations: -1
      wait_after_operations: 0
      wait_duration_seconds: 0
      # TEMPERED SKEW mirroring the GoCardless row-count profile (image 2026-06-19).
      # weight = round(sqrt(rows/1e6)*100), floored at 2; ~1400:1 raw -> ~100:1.
      # The 7 heaviest here are exactly the tables pre-split in presplit_heavy_tables.
      # All 307 unlisted tables default to weight 1 (still streamed -> broad CDC).
      table_weights:
        table_017d77bfa1eae59d: 1000   # ~payment_actions (1,000,000 rows)
        table_01b166ea768098a2: 652   # ~payment_attempts (652,000 rows)
        table_0212e6da9ca746bc: 645   # ~payments (645,000 rows)
        table_028550ca941cb442: 640   # ~transaction_fees (640,000 rows)
        table_039e819fbffd6f7d: 599   # ~payments_pending_confirmation (599,000 rows)
        table_03f86ebc4c0593d8: 421   # ~core_banking_synthetic_balances (421,000 rows)
        table_04c4c2caaebdc62d: 259   # ~revenue_shares (259,000 rows)
        table_052d762fb20c1c2a: 34   # ~access_tokens (34,000 rows)
        table_057c259e690ef255: 34   # ~core_banking_expected_event_counts (34,000 rows)
        table_064efb48ef43191d: 21   # ~app_fees (21,000 rows)
        table_06ab17adea443e04: 17   # ~core_banking_received_events (17,000 rows)
        table_0720e4a45aa6974d: 17   # ~refund_transitions (17,000 rows)
        table_07336e32ea21b4b8: 9   # ~payouts (9,000 rows)
        table_0747e9e9ea3c0a5d: 6   # ~credit_transitions (6,000 rows)
        table_07fe435a8c212bdb: 5   # ~mandate_histories (5,000 rows)
        table_080c5b2ff3611298: 4   # ~users (4,000 rows)
        table_0931a9825cc585d6: 3   # ~export_transitions (3,000 rows)
        table_0991d0da4fc8dac0: 3   # ~credits (3,000 rows)
        table_09a465856531b439: 3   # ~subscriptions (3,000 rows)
        table_0aa72fe24569eb52: 3   # ~mandates (3,000 rows)
        table_0aafd7f4a3234115: 2   # ~subscription_transitions (2,000 rows)
        table_0b131bb9457188ac: 2   # ~exports (2,000 rows)
        table_0b243ef8cb6da8d4: 2   # ~customers (2,000 rows)
        table_0ba2c4755b4978df: 1   # ~customer_billing_details (1,000 rows)
        table_0d1147a0a3c8436e: 1   # ~billing_request_transitions (1,000 rows)
        table_0da90d2791dce2ca: 1   # ~surcharge_fees (1,000 rows)
        table_0e2bf67d74b0aa11: 1   # ~browser_sessions (1,000 rows)
        table_0e8752d52216d0a3: 1   # ~billing_requests (1,000 rows)
        table_0ea8eb5b98b302a1: 1   # ~creditors (1,000 rows)
        table_0fa9e09e40bf748d: 1   # ~mandate_requests (880 rows)
        table_1042e9a572eb1e58: 1   # ~instalment_schedule_transitions (765 rows)
        table_1184bf309828ad0d: 1   # ~bank_accounts (693 rows)
      operation_weights: {INSERT: 3, UPDATE: 2, DELETE: 1}
      random_seed: 456
      faker_seed: 456
      insert_rows: 25
      update_rows: 12
      delete_rows: 6
      insert_max_retries: 5
      update_max_retries: 1
      # baseline 1.5k, 10k spike for 5 min every 30 min.
      rate_control:
        default_events_per_second: 1500
        report_interval_seconds: 60
        schedule:
          - {events_per_second: 10000, duration_seconds: 300, every_seconds: 1800, offset_seconds: 300, jitter_pct: 0}
    parallel:
      run_seconds: 262800           # 73h: covers the 72h soak + calibration + margin
      max_workers: 36               # dedicated 32-core box -> full headroom for 10k under live CDC
      calibration_seconds: 120
      calibration_warmup_seconds: 30
      reactive_margin: 1.5
      control_interval_seconds: 5
      recalibrate: true
      allow_throttle: true
      distribute_across_nodes: true
      meter_window_seconds: 15

voyager:
  export_schema:
    flags:
      skip-performance-recommendations: "true"
  cutover_to_target:
    flags:
      prepare-for-fall-back: true
  cutover_to_source:
    flags:
      restart-data-migration-source-target: true
  import_to_source:
    flags:
      parallel-jobs: 8

stages:
  - name: create_source_and_target_dbs
    action: reset_databases
    targets: [source, target]

  - name: create_source_schema
    action: run_sql
    sql_path: ./anonymized-schema.sql
    use_admin: true

  - name: increase_temp_file_limit_source
    action: run_sql
    sql_path: ./temp_file_limit.sql
    target: source
    use_admin: true

  - name: increase_temp_file_limit_target
    action: run_sql
    sql_path: ./temp_file_limit.sql
    target: target
    use_admin: true

  - name: create_cutover_table
    action: create_cutover_table
    target: [source]

  - name: grant_source_permissions
    action: grant_source_permissions
    is_live_migration_fall_back: 1

  - name: export_schema_from_source
    action: voyager_export_schema

  # ---- Pre-split the 7 hottest tables to 6 tablets (1 leader/node) BEFORE they
  #      are created on YB. Runs on the exported (inline-PK) table.sql. ----
  - name: presplit_heavy_tables
    action: presplit_tables
    default_table_tablets: 3        # cold base tables
    default_index_tablets: 4        # cold indexes
    table_tablets:
      table_017d77bfa1eae59d: 216
      table_01b166ea768098a2: 49
      table_0212e6da9ca746bc: 48
      table_028550ca941cb442: 48
      table_039e819fbffd6f7d: 45
      table_03f86ebc4c0593d8: 31
      table_04c4c2caaebdc62d: 19
      table_052d762fb20c1c2a: 3
      table_057c259e690ef255: 3
      table_064efb48ef43191d: 2
    index_tablets:
      table_017d77bfa1eae59d: 31
      table_01b166ea768098a2: 49
      table_0212e6da9ca746bc: 24
      table_028550ca941cb442: 48
      table_039e819fbffd6f7d: 45
      table_03f86ebc4c0593d8: 31
      table_04c4c2caaebdc62d: 19
      table_052d762fb20c1c2a: 3
      table_057c259e690ef255: 3
      table_064efb48ef43191d: 2

  - name: import_schema_on_target
    action: voyager_import_schema

  # ---- Phase 1: forward migrate + cutover to target ----
  - name: start_exporter
    action: voyager_export_start

  - name: start_importer
    action: voyager_import_start

  - name: start_baseline_generator
    action: generator_start
    generator_key: generator_source

  - name: wait_exporter_streaming
    action: wait_for
    condition: exporter_in_streaming_phase
    timeout_sec: 600

  - name: start_archiver
    action: voyager_archive_changes_start
    policy: delete

  - name: seed_soak
    action: sleep
    seconds: 120

  - name: stop_baseline_generator
    action: generator_stop
    generator_key: generator_source
    graceful_timeout_sec: 30

  - name: insert_backlog_marker
    action: run_sql
    target: source
    sql_path: ../common-sql/insert_marker.sql

  - name: wait_backlog_zero
    action: wait_for
    condition: remaining_events_eq_0
    timeout_sec: 600

  - name: wait_for_archiver
    action: sleep
    seconds: 60

  - name: validate_archive_changes
    action: validate_archive_changes

  - name: cutover_to_target
    action: cutover_to_target

  - name: wait_cutover_to_target_completed
    action: wait_for
    condition: cutover_to_target_status_completed
    timeout_sec: 300

  - name: stop_forward_exporter
    action: voyager_stop_command
    command: export_data
    graceful_timeout_sec: 60

  - name: stop_forward_importer
    action: voyager_stop_command
    command: import_data
    graceful_timeout_sec: 60

  - name: row_count_validations
    action: row_count_validations

  - name: row_hash_validations
    action: row_hash_validations

  # ---- Phase 2: fall-back spike + recovery (72h; generator on the gen box) ----
  - name: start_fallback_exporter_from_target
    action: voyager_export_from_target_start

  - name: start_fallback_importer_to_source
    action: voyager_import_to_source_start

  - name: start_throughput_monitor
    action: monitor_start
    exporter_role: target_db_exporter_fb
    import_role: source
    interval_sec: 60

  - name: start_spike_generator          # <-- launches parallel_generator.py on …77 over SSH
    action: generator_start
    generator_key: generator_target

  - name: spike_soak
    action: sleep
    seconds: 259200                       # 72h fresh soak

  - name: stop_spike_generator           # <-- graceful remote pkill + rate-csv pullback
    action: generator_stop
    generator_key: generator_target
    graceful_timeout_sec: 60

  - name: insert_backlog_marker_on_target
    action: run_sql
    target: target
    sql_path: ../common-sql/insert_marker.sql

  - name: wait_backlog_zero_after_fallback
    action: wait_for
    condition: remaining_events_eq_0
    timeout_sec: 3600

  - name: wait_for_archiver_fallback
    action: sleep
    seconds: 60

  - name: validate_archive_changes_fallback
    action: validate_archive_changes

  - name: stop_throughput_monitor
    action: monitor_stop
    graceful_timeout_sec: 30

  - name: plot_throughput
    action: plot_throughput

  - name: validate_recovery
    action: validate_recovery

  - name: cutover_to_source
    action: cutover_to_source

  - name: wait_cutover_to_source_completed
    action: wait_for
    condition: cutover_to_source_status_completed
    timeout_sec: 300

  - name: row_count_validations_fallback
    action: row_count_validations

  - name: row_hash_validations_fallback
    action: row_hash_validations
